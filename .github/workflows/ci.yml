name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The db client is lazy and TMDB calls are only made at request time, so
      # a production build needs no database and no API key. If this step ever
      # starts requiring either, something has moved work to module scope.
      - name: Build
        run: npm run build

      - name: Check migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes with no migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
